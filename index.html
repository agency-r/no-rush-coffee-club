<!DOCTYPE html>
<!--
================================================================================
 NO RUSH COFFEE CLUB  —  a 3D coffee-shop survival-strategy simulator
 Single self-contained HTML file for mobile web browsers (iOS Safari / Chrome
 Android first; desktop mouse + keyboard supported for testing).

 Everything is code: every mesh, material, texture, icon, label and sound is
 generated procedurally at runtime (CanvasTexture / vertex colours / WebAudio).
 No external models, images, textures, fonts or audio files.

 MAIN DEPENDENCY: three.js r160 (ES modules from unpkg via import map)
   https://unpkg.com/three@0.160.0/build/three.module.js
   + its bundled addons: RoundedBoxGeometry, BufferGeometryUtils, RoomEnvironment

 ONLINE MULTIPLAYER HELPER: PeerJS 1.5.4 (WebRTC signalling via the free PeerJS
 cloud broker), loaded lazily only when you tap "Host online" or "Join":
   https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js
   Host = authoritative simulation; guests stream inputs and render snapshots.
   Public STUN only (Google, Cloudflare) — no TURN relay is bundled, so some
   strict mobile-carrier NATs may not connect (see NET_CFG.ice, section 29).
   "Play solo" works with no network at all once three.js is cached.

 HOW TO PLAY
   Gather beans / cups / milk from the pantry, feed the grinder, brew espresso,
   steam lattes, serve the queue at the register, collect the cash and spend it
   on the orange "unlock pads" to expand the café. No rush: calm, well-timed
   service (machines in their green heat band, customers served before they get
   impatient) earns PERFECT quality, bigger tips and reputation.
   Touch: drag anywhere = floating joystick; DROP button drops your top item.
   Tap a station to walk there and open its card / upgrade.
   Two fingers = orbit / zoom camera. A short How-to-play shows on first launch.
   Online: 1-4 baristas, each on their own device. Host gets a 5-letter room
   code + ?room=CODE link; lobby with names, colours, ready, co-op / versus.
   Keys: WASD / arrows move · Space / E / Enter drop · 1-4 theme · C camera ·
         Esc menu
================================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#efe9e1">
<title>No Rush Coffee Club</title>
<link rel="icon" href="data:,">
<style>
:root{
  --u:8px;
  --bg:#f4f3ef; --panel:rgba(250,250,248,.94); --fg:#141414; --mute:#7a7a76; --line:#d6d4ce;
  --accent:#ff5f00; --accent-fg:#ffffff; --ok:#1fae5b; --warn:#e2231a; --shade:#bdbab2; --chip:#ecebe6;
  --sat:env(safe-area-inset-top,0px); --sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px);
  --font:"Helvetica Neue",Helvetica,Inter,"Inter var",Arial,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font-family:var(--font);color:var(--fg);-webkit-font-smoothing:antialiased;}
#app{position:fixed;inset:0;touch-action:none;}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
.hidden{display:none!important;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
.k{font-size:9px;letter-spacing:.14em;font-weight:700;text-transform:uppercase;color:var(--mute);}
/* ---------- HUD grid ---------- */
#hud{position:absolute;inset:0;pointer-events:none;
  padding:calc(var(--sat) + var(--u)) calc(var(--sar) + var(--u)) calc(var(--sab) + var(--u)) calc(var(--sal) + var(--u));}
#top{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--u);align-items:stretch;}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:6px 8px 7px;position:relative;
  box-shadow:0 1px 0 var(--line),0 6px 18px rgba(0,0,0,.06);}
.cell .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.05;margin-top:2px;}
.cell .sub{font-size:10px;font-weight:600;color:var(--mute);margin-top:2px;letter-spacing:.04em;}
.cell .idx{position:absolute;top:5px;right:7px;font-size:8px;font-weight:700;color:var(--mute);letter-spacing:.1em;}
#cDay{grid-column:span 2;} #cCash{grid-column:span 2;} #cRep{grid-column:span 2;}
#cBtns{grid-column:span 6;display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 148px;gap:4px;padding:0;background:transparent;border:none;box-shadow:none;}
.bar{height:3px;background:var(--chip);margin-top:5px;position:relative;overflow:hidden;}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);}
.cash .v{color:var(--fg);}
.stars{display:flex;gap:2px;margin-top:4px;}
.stars b{width:10px;height:3px;background:var(--chip);} .stars b.on{background:var(--accent);}
/* physical buttons */
.btn{pointer-events:auto;font-family:var(--font);border:1px solid var(--line);background:var(--panel);color:var(--fg);
  border-radius:3px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;min-height:40px;
  box-shadow:0 3px 0 var(--shade);transform:translateY(0);transition:transform .05s,box-shadow .05s;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation;}
.btn:active,.btn.press{transform:translateY(2px);box-shadow:0 1px 0 var(--shade);}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);box-shadow:0 3px 0 rgba(0,0,0,.28);}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg);}
.btn svg{width:16px;height:16px;}
#themeRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;pointer-events:auto;}
#themeRow .btn{min-width:0;min-height:40px;font-size:11px;padding:0;}
#themeRow .btn i{display:block;width:14px;height:4px;border-radius:1px;}
/* goal */
#goal{margin-top:var(--u);display:flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);border-radius:3px;
  padding:7px 10px;font-size:11px;font-weight:700;letter-spacing:.02em;max-width:560px;}
#goal .gk{background:var(--accent);color:var(--accent-fg);font-size:9px;letter-spacing:.14em;padding:3px 5px;border-radius:2px;}
#goal .gp{margin-left:auto;font-size:10px;opacity:.7;}
/* side columns */
#orders{position:absolute;left:calc(var(--sal) + var(--u));display:flex;flex-direction:column;gap:6px;width:104px;}
.tk{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:3px;padding:5px 6px 6px;}
.tk .tn{display:flex;justify-content:space-between;font-size:8px;font-weight:700;letter-spacing:.12em;color:var(--mute);}
.tk .ti{display:flex;gap:3px;margin-top:4px;min-height:22px;align-items:center;}
.tk .ti img{width:22px;height:22px;}
.tk .tb{height:3px;background:var(--chip);margin-top:4px;position:relative;}
.tk .tb i{position:absolute;left:0;top:0;bottom:0;background:var(--ok);}
#side{position:absolute;right:calc(var(--sar) + var(--u));display:flex;flex-direction:column;gap:6px;width:112px;}
.rs{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 7px;}
.rrow{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin:3px 0 2px;}
.rrow div{display:flex;flex-direction:column;align-items:center;font-size:12px;font-weight:800;}
.rrow img{width:20px;height:20px;}
.mrow{display:flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.08em;height:18px;}
.mrow .dot{width:7px;height:7px;border-radius:50%;background:var(--chip);flex:none;}
.mrow .mt{margin-left:auto;color:var(--mute);font-weight:600;}
/* event banner */
#event{position:absolute;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);border-radius:3px;
  padding:8px 14px;font-size:12px;font-weight:800;letter-spacing:.08em;text-align:center;white-space:nowrap;
  box-shadow:0 8px 24px rgba(0,0,0,.18);transition:opacity .3s,transform .3s;}
#event small{display:block;font-size:9px;font-weight:600;letter-spacing:.06em;opacity:.85;margin-top:2px;}
#event.off{opacity:0;transform:translateX(-50%) translateY(-10px);}
/* toasts */
#toast{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;}
.toast{background:var(--fg);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.06em;padding:6px 10px;border-radius:3px;
  animation:tin .25s ease-out;}
@keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* player zones */
#zones{position:absolute;inset:0;pointer-events:none;}
.zone{position:absolute;}
.zone .zb{position:absolute;inset:0;border:1px dashed transparent;}
.zone.multi .zb{border-color:rgba(127,127,127,.25);}
.zone .ztag{position:absolute;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);
  border-radius:3px;padding:4px 7px;font-size:10px;font-weight:700;letter-spacing:.06em;}
.zone .ztag i{width:10px;height:10px;border-radius:2px;display:block;}
.zone .act{position:absolute;width:64px;height:64px;border-radius:50%;pointer-events:auto;border:none;color:#fff;
  font-family:var(--font);font-size:9px;font-weight:800;letter-spacing:.12em;box-shadow:0 4px 0 rgba(0,0,0,.25),inset 0 -6px 12px rgba(0,0,0,.12);
  display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:none;}
.zone .act:active,.zone .act.press{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
.zone .act small{font-size:16px;font-weight:800;letter-spacing:0;line-height:1;}
.joy{position:absolute;width:112px;height:112px;margin:-56px 0 0 -56px;border-radius:50%;
  border:2px solid rgba(255,255,255,.75);background:rgba(20,20,20,.10);box-shadow:0 0 0 1px rgba(0,0,0,.08);transition:opacity .2s;}
.joy .kn{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;
  box-shadow:0 4px 10px rgba(0,0,0,.25),inset 0 -4px 8px rgba(0,0,0,.18);border:2px solid #fff;}
.joy.idle{opacity:.38;} .zone.multi .joy.idle{opacity:.28;}
/* overlays */
.ov{position:absolute;inset:0;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) calc(var(--sab) + 16px) calc(var(--sal) + 16px);}
.ov.dim{background:rgba(0,0,0,.28);}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;width:min(560px,100%);max-height:100%;overflow:auto;
  box-shadow:0 24px 60px rgba(0,0,0,.22);padding:16px;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
.card h2{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1;}
.card h3{font-size:10px;font-weight:700;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;}
.hr{height:1px;background:var(--line);margin:12px 0;}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
.row .ix{font-size:9px;font-weight:700;color:var(--mute);letter-spacing:.1em;}
.row .nm{font-size:13px;font-weight:700;} .row .ds{font-size:10px;color:var(--mute);margin-top:2px;}
.row .btn{min-width:84px;min-height:40px;font-size:10px;padding:0 8px;}
.seg{display:grid;gap:4px;margin-top:6px;}
.seg .btn{min-height:44px;font-size:13px;}
/* title */
#title{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.0) 40%,rgba(0,0,0,.10) 100%);align-items:flex-end;}
#title .card{width:min(520px,100%);}
.tt{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;}
.tt .logo{grid-column:span 6;font-size:44px;font-weight:800;letter-spacing:-.05em;line-height:.88;}
.tt .logo b{color:var(--accent);}
.tt .meta{grid-column:span 6;display:flex;justify-content:space-between;font-size:9px;font-weight:700;letter-spacing:.14em;color:var(--mute);}
.lbl{display:flex;gap:8px;align-items:baseline;margin-top:12px;}
.lbl .ix{font-size:9px;font-weight:800;color:var(--accent);letter-spacing:.1em;}
.big{min-height:56px!important;font-size:15px!important;letter-spacing:.16em!important;margin-top:14px;width:100%;}
/* summary */
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.sbox{border:1px solid var(--line);border-radius:3px;padding:8px;}
.sbox .v{font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:3px;}
.sbox.acc{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
.sbox.acc .k{color:var(--accent-fg);opacity:.8;}
.ptab{width:100%;border-collapse:collapse;margin-top:8px;font-size:12px;}
.ptab td,.ptab th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;}
.ptab th{font-size:8px;letter-spacing:.12em;color:var(--mute);text-align:right;}
.ptab td:first-child,.ptab th:first-child{text-align:left;}
.ptab i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;}
.banner{font-size:11px;font-weight:800;letter-spacing:.12em;padding:6px 8px;border-radius:2px;display:inline-block;}
#fade{position:absolute;inset:0;background:var(--bg);pointer-events:none;transition:opacity .8s;}
/* ---------- responsive ---------- */
@media (orientation:portrait){
  #title .card{padding:12px 14px;} #title .tt .logo{font-size:38px;} #title .seg .btn{min-height:40px;font-size:12px;} #title .lbl{margin-top:8px;} #title .big{min-height:50px!important;margin-top:10px;}
  #cDay{grid-column:span 4;} #cCash{grid-column:span 4;} #cRep{grid-column:span 4;}
  #cBtns{grid-column:span 12;grid-template-columns:repeat(4,minmax(0,1fr)) 128px;padding:0;}
  #cBtns .btn{flex-direction:row;min-height:40px;gap:5px;}
  #cBtns .btn svg{width:14px;height:14px;}
  .cell .v{font-size:20px;}
  #goal{font-size:10px;}
}
@media (orientation:landscape){ #title{align-items:center;justify-content:flex-start;} #title .card{width:min(440px,52vw);} }
@media (orientation:landscape) and (max-height:500px){
  #title .card{padding:10px 12px;} #title .seg .btn{min-height:36px;font-size:11px;} #title .lbl{margin-top:6px;} #title .big{min-height:44px!important;margin-top:8px;}
  .cell{padding:4px 7px 5px;} .cell .v{font-size:17px;} .cell .sub{display:none;}
  #cBtns .btn{min-height:36px;}
  #goal{margin-top:6px;padding:5px 9px;max-width:420px;}
  .tk .ti img{width:18px;height:18px;} .tk .ti{min-height:18px;}
  #side{width:104px;} .rrow img{width:16px;height:16px;} .mrow{height:15px;}
  .card{padding:12px;} .card h2{font-size:22px;}
  .tt .logo{font-size:34px;}
  .sgrid{grid-template-columns:repeat(6,1fr);} .sbox .v{font-size:18px;}
}

/* ---- online: player chips, lobby ---- */
#plist{position:absolute;left:calc(var(--sal) + var(--u));right:calc(var(--sar) + var(--u));display:flex;flex-wrap:wrap;gap:4px;pointer-events:none;}
#hud:not(.online) #plist{display:none;}
.pc{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:3px 7px;font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;}
.pc i{width:8px;height:8px;border-radius:2px;flex:none;}
.pc .s{color:var(--mute);font-weight:700;margin-left:2px;}
.pc.me{border-color:var(--fg);}
.pc.away{opacity:.5;}
.pc.net i{background:var(--ok);border-radius:50%;}
.pc.net.bad i{background:var(--warn);}
.inp{width:100%;font-family:var(--font);font-size:16px;font-weight:700;color:var(--fg);background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:10px 12px;margin-top:6px;outline:none;pointer-events:auto;user-select:text;-webkit-user-select:text;}
.inp:focus{border-color:var(--accent);}
.inp.code{font-size:30px;letter-spacing:.32em;text-transform:uppercase;text-align:center;font-weight:900;}
.inp.sm{font-size:11px;padding:0 8px;margin:0;min-height:44px;color:var(--mute);}
.lbcode{font-size:46px;font-weight:900;letter-spacing:.22em;line-height:1;margin-top:4px;color:var(--fg);}
.slots{display:grid;gap:3px;margin-top:6px;}
.slot{display:grid;grid-template-columns:20px 10px 1fr auto;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--line);border-radius:3px;background:var(--panel);font-size:13px;}
.slot i{width:10px;height:10px;border-radius:2px;}
.slot .ix{font-size:9px;font-weight:800;color:var(--mute);letter-spacing:.1em;}
.slot.empty{opacity:.45;border-style:dashed;}
.slot.off{opacity:.55;}
.slot.me{border-color:var(--fg);}
.k.st{min-height:14px;}
/* ---- how to play ---- */
#tut{background:color-mix(in srgb,var(--bg) 82%,transparent);z-index:30;padding:calc(var(--sat) + 12px) calc(var(--sar) + 12px) calc(var(--sab) + 12px) calc(var(--sal) + 12px);}
.tcard{width:min(440px,100%);}
.thead{display:flex;justify-content:space-between;align-items:center;}
.tskip{min-height:34px!important;padding:0 14px;font-size:11px;letter-spacing:.12em;}
.tgrid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px;}
.tart{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--chip);border:1px solid var(--line);border-radius:3px;padding:12px;color:var(--fg);}
.ttext h2{margin-top:6px;}
.ttext p{font-size:14px;line-height:1.5;margin-top:8px;color:var(--fg);font-weight:500;}
.tflow{display:flex;align-items:center;gap:8px;color:var(--mute);}
.tbox{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;border:1px solid var(--line);background:var(--panel);border-radius:3px;font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--fg);}
.tbox.acc{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);}
.tbox.big{font-size:22px;padding:8px 14px;}
.tbox small{font-size:8px;}
.tstack{display:flex;flex-direction:column-reverse;align-items:center;gap:0;}
.tstack img{margin-top:-8px;}
.theat{display:flex;width:80%;height:8px;gap:2px;margin-top:12px;}
.theat i{flex:1;border-radius:1px;}
.tpad{width:150px;height:110px;border:3px dashed var(--accent);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:perspective(300px) rotateX(38deg);background:color-mix(in srgb,var(--accent) 12%,transparent);}
.tpad b{font-size:34px;color:var(--accent);font-weight:900;}
.tpad small{font-size:8px;font-weight:800;letter-spacing:.12em;color:var(--fg);}
.tcalm{text-align:center;}
.tcalm b{display:block;font-size:52px;font-weight:900;color:var(--accent);letter-spacing:-.03em;line-height:1;}
.tbar{display:flex;gap:3px;margin-top:8px;justify-content:center;}
.tbar i{width:14px;height:6px;background:var(--accent);border-radius:1px;}
.tbar i.off{background:var(--line);}
.tthemes{display:grid;grid-template-columns:repeat(4,46px);gap:6px;}
.tthemes div{height:46px;border:1px solid;border-radius:3px;position:relative;display:flex;align-items:flex-end;padding:4px;font-weight:900;font-size:13px;}
.tthemes i{position:absolute;top:5px;left:5px;width:14px;height:5px;border-radius:1px;}
.tplayers{display:flex;gap:6px;margin-top:12px;}
.tplayers i{width:22px;height:22px;border-radius:50%;}
.tdots{display:flex;gap:4px;margin-top:12px;}
.tdots i{flex:1;height:3px;background:var(--line);border-radius:1px;}
.tdots i.past{background:var(--fg);}
.tdots i.on{background:var(--accent);}
@media (orientation:landscape) and (max-height:520px){
  .tcard{width:min(680px,100%);padding:12px 14px;}
  .tgrid{grid-template-columns:1fr 1.15fr;align-items:center;}
  .tart{min-height:170px;}
  .ttext p{font-size:13px;}
  .lbcode{font-size:34px;}
  .card.lb .slot{padding:5px 8px;font-size:12px;}
  .card.lb .inp{padding:7px 10px;}
  .card.lb .inp.code{font-size:24px;}
}

/* ---- v3 compact HUD: essentials only, translucent, off the play area ---- */
#top{display:flex;gap:4px;align-items:stretch;max-width:540px;grid-template-columns:none;}
#top .cell{flex:1 1 0;min-width:0;padding:4px 7px 5px;background:color-mix(in srgb,var(--panel) 80%,transparent);box-shadow:0 4px 14px rgba(0,0,0,.05);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
#top .cell .v{font-size:17px;margin-top:1px;}
#top .cell .sub{font-size:8px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#top .cell .k{font-size:8px;}
#top .stars{margin-top:2px;} #top .stars b{width:8px;}
#top .bar{margin-top:3px;}
#cBtns{display:flex!important;gap:4px;flex:none;grid-column:auto;padding:0;background:none;border:none;box-shadow:none;}

#goal{margin-top:4px;display:block;padding:5px 8px;max-width:540px;background:color-mix(in srgb,var(--fg) 86%,transparent);}

#orders .tk .ti{margin-top:0;min-height:18px;gap:1px;}
#orders .tk .ti img{width:18px;height:18px;}
#orders .tk .ti b{font-size:9px!important;}
#orders .tk .tb{margin-top:3px;height:2px;}
.chip{position:absolute;right:calc(var(--sar) + var(--u));pointer-events:auto;display:flex;align-items:center;gap:5px;font-family:var(--font);font-size:10px;font-weight:800;color:var(--fg);

.chip img{width:14px;height:14px;}
.chip.warn{border-color:var(--warn);color:var(--warn);}
.chip .cv{font-size:9px;opacity:.6;}
#side{width:118px!important;}
#side .rs{background:color-mix(in srgb,var(--panel) 90%,transparent);}
#plist{gap:3px;}
.pc{padding:2px 6px;font-size:8px;background:color-mix(in srgb,var(--panel) 82%,transparent);}

.troles{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;max-width:300px;}

  for (const id of ids) if (SBY[id].out.count(t)) return { txt: `Pick up ${ITEM[t].name.toUpperCase()} at ${SBY[id].title}`, t: SBY[id].zone };
  let s = SBY[ids[0]];
  if (ids.length > 1) { const s2 = SBY[ids[1]]; if (s.over > 0 || (s.busy && !s2.busy)) s = s2; }
  if (s.kind === 'source') return { txt: s.out.items.length ? `Grab ${ITEM[t].name.toUpperCase()} from the ${s.title} rack` : `${s.title} empty — delivery on the way`, t: s.zone };
  if (s.kind === 'producer') return { txt: 'Croissants baking — no rush', t: s.zone };
  if (s.over > 0) return { txt: `${s.title} cooling down — breathe`, t: s.zone };
  if (s.busy) return { txt: `${s.title} ${s.state.toLowerCase()} — no rush`, t: s.zone };
  for (const it in s.need) if (s.inputs[it].items.length < s.need[it]) {
    if (p.pile.count(it)) return { txt: `Drop ${ITEM[it].name.toUpperCase()} at the ${s.title}`, t: s.zone };

}

  if (CASHPILE.items.length >= 4 || (CASHPILE.items.length && !G.queue.length)) return { txt: 'Collect the cash at the tray', t: CASHZ };
  const pad = PADS.find(u => u.visible && !u.done && G.cash + .01 >= (u.cost - u.paid));
  if (pad && (!G.queue.length || G.queue[0].pat > .45)) return { txt: `Stand on the pad — unlock ${pad.name}`, t: { x: pad.x, z: pad.z } };
  const c = G.queue.find(c => c.state === 'queue' || c.state === 'walk' || c.state === 'arrive');
  if (c) {
    const carried = c.need.find(t => G.players.some(pl => pl.pile.count(t)));
    if (carried) return { txt: `Serve ${ITEM[carried].name.toUpperCase()} at the REGISTER`, t: REGISTER };
    for (const t of c.need) { const g = chainGoal(t, p, 0); if (g) return g; }
  }
  if (SBY.esp1.out.items.length < 2 && p.pile.items.length < p.cap) { const g = chainGoal('espresso', p, 0); if (g) { g.txt = 'Prep ahead: ' + (/^[A-Z][a-z]/.test(g.txt) ? g.txt.charAt(0).toLowerCase() + g.txt.slice(1) : g.txt); return g; } }
  const up = UPG.find(u => G.upg[u.id] < 3 && G.cash >= u.costs[G.upg[u.id]]);

}

  GOALPTR.visible = vis; ring.visible = vis;
  if (vis) {

// =============================================================================
// 29  ONLINE MULTIPLAYER — PeerJS signalling, host-authoritative simulation
// -----------------------------------------------------------------------------
// The host's browser runs the whole café (customers, stations, stock, cash,
// reputation, day cycle, unlocks, events) and streams snapshots (~15 Hz) to up
// to 3 guests. Guests send their joystick vector (~30 Hz) + action / tap / buy
// requests, predict their own barista locally and interpolate everything else.
// Two data channels per guest: 'r' reliable (lobby, start, actions, theme, day
// summary, pings) and 'u' unreliable (snapshots, inputs; falls back to 'r').
// PeerJS is loaded lazily from unpkg only when you host or join, so solo play
// never touches the network. Only public STUN servers are configured: two
// phones behind strict/symmetric NATs (some mobile carriers) need a TURN relay,
// which is not included — add one to NET_CFG.ice if your players cannot connect.
// =============================================================================
const NET_CFG = {
  lib: 'https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js', prefix: 'nrcc-',

  peer: null, code: '', status: '', slots: [], conn: null, uconn: null, seq: 0, fxq: [], stats: { conns: 0 }, lastRx: 0, snapAt: 0, inAt: 0, pingAt: 0, ping: 0,

  // ---------------------------------------------------------------- CLIENT
  showJoin(code) { if (this.role !== 'solo') this.leave(); this.screen = 'join'; this.joinCode = cleanCode(code); this.status = ''; this._built = ''; this.renderScreen(); },
  join(code) {

    this.leave(); this.role = 'client'; this.code = code; this.screen = 'lobby'; this.ready = false; this.tries = 0; this._built = '';
    this.setStatus('Connecting to room ' + code + '…'); this.renderScreen();
    this.loadLib().then(() => this.openClient()).catch(() => this.setStatus('Could not load the network library — check your connection.'));
  },
  openClient() {
    if (this.role !== 'client') return;

    const peer = new window.Peer(this.peerOpts()); this.peer = peer;
    peer.on('open', () => { if (this.peer === peer) this.connectHost(); });
    peer.on('disconnected', () => { if (this.peer === peer && this.role === 'client') setTimeout(() => { if (this.peer === peer && !peer.destroyed) { try { peer.reconnect(); } catch (e) {} } }, 1200); });

  syncPile(P, arr, fromFn) {

  for (let i = 0; i < 6; i++) { G.spawnT = 0; spawnCustomer(); const c = G.customers[G.customers.length - 1]; c.ch.pos.set(SLOTS[Math.min(10, c.slot)][0], 0, SLOTS[Math.min(10, c.slot)][1]); c.path = []; c.state = 'walk'; c.wp = Math.min(10, c.slot); }
  const seated = SEATS.filter(s => s.on).slice(0, 4);
  seated.forEach((se, i) => { const c = new Customer(); c.state = 'sit'; c.seat = se; se.busy = c; c.sitT = 1e9; c.ch.pos.set(se.x, 0, se.z); c.ch.yaw = se.ry; c.ch.sit = 1; c.pile.add(['latte', 'espresso', 'croissant', 'americano'][i], 1); G.customers.push(c); });
  $('title').classList.remove('hidden'); $('hud').classList.add('hidden'); $('zones').classList.add('hidden'); $('summary').classList.add('hidden'); $('panel').classList.add('hidden');
  UI.refreshTitle();
}

// =============================================================================
// 27  MAIN LOOP
// =============================================================================
const PERF = { fps: 60, frames: 0, acc: 0, n: 0, low: 0, ms: 0 };
function updateVisuals(dt) {
  const t = clock.elapsedTime;
  IR.begin();
  for (const s of STATIONS) {
    if (!s.unlocked || !s.group.visible) continue;
    for (const k in s.inputs) s.inputs[k].render(dt);
    if (s.out) s.out.render(dt);
    if (s.gauge) {
      const u = s.gauge.material.uniforms, U = THEME.ui;
      u.uP.value = s.kind === 'producer' ? s.prog : s.busy ? s.prog : s.over > 0 ? 1 - s.over / 5 : 0;
      u.uCol.value.set(s.over > 0 ? U.warn : s.busy ? U.accent : s.out.items.length ? U.ok : U.accent);
      u.uTrack.value.set(THEME.id === 'GRID' ? '#3a3a3a' : '#dcdad4'); u.uDisc.value.set(THEME.id === 'GRID' ? '#151515' : '#ffffff');
      u.uHeat.value = s.heat; u.uHeatCol.value.set(s.heat < .35 ? '#7fb2ff' : s.heat > .85 ? U.warn : '#1fae5b');
      const ready = !s.busy && s.out.items.length > 0;
      u.uA.value = s.busy || ready || s.over > 0 || s.heatOn ? 1 : .7;
      u.uPulse.value = ready ? (Math.sin(t * 6) * .5 + .5) * .6 : 0;
      const bounce = ready ? Math.abs(Math.sin(t * 3)) * .06 : 0;
      s.gauge.position.y = (s.gaugeY || 2.1) + bounce;
      s.gauge.scale.setScalar(.9 * (s.building ? s.group.scale.x : 1));
    }
  }
  CASHPILE.render(dt);
  for (const p of G.players) p.pile.render(dt, p.ch.yaw);
  for (const c of G.customers) c.pile.render(dt, c.ch.yaw);
  FLY.update(dt);
  IR.end();
  for (const m of BILL) m.quaternion.copy(camera.quaternion);
  for (const u of PADS) {
    if (!u.visible) continue;
    u.pad.arrow.position.y = 1.3 + Math.sin(t * 4 + u.x) * .12; u.pad.arrow.rotation.y = t * 1.5;
    if (u.pad.lastDrawn !== u.paid) { u.pad.lastDrawn = u.paid; u.pad.redraw(); }
    const aff = G.cash + .01 >= u.cost - u.paid; u.pad.mesh.scale.setScalar(aff ? 1 + Math.sin(t * 5) * .03 : 1);
  }
  // light follows the day: crisp morning → golden late afternoon
  const dk = clamp(G.t / G.dayLen, 0, 1.1);
  _c1.set('#fff3e2'); _c2.set('#ffb070'); sun.color.copy(_c1).lerp(_c2, clamp((dk - .55) / .5, 0, 1) * (THEME.id === 'GRID' ? .5 : .85));
  sun.intensity = THEME.light.sun * (1 - .12 * clamp((dk - .7) / .4, 0, 1));
  // clock follows the in-game day (08:00 → 18:00)
  const mins = 8 * 60 + clamp(G.t / G.dayLen, 0, 1.05) * 600;
  if (LIVE.hourHand) { LIVE.hourHand.rotation.z = -(mins / 60 % 12) / 12 * TAU; LIVE.minHand.rotation.z = -(mins % 60) / 60 * TAU; }
  for (const c of LIVE.cars) { c.x += c.v * dt; if (c.x < -45) c.x = 45; if (c.x > 45) c.x = -45; c.g.position.set(c.x, 0, c.z); c.g.rotation.y = c.v < 0 ? Math.PI : 0; }
  if (TAPMARK.visible) { TAPMARK.userData.t -= dt; const k = TAPMARK.userData.t / .6; TAPMARK.scale.setScalar(1 + (1 - k) * 1.2); TAPMARK.material.opacity = Math.max(0, k); if (k <= 0) TAPMARK.visible = false; }
  PFX.update(dt, t);
  updateFloatText(dt);
}
function frame() {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  const rdt = Math.min(clock.getDelta(), .05);
  const dt = rdt * G.speed;
  NET.tick(rdt);
  if (G.state === 'play') { readInputs(); if (NET.role === 'client') NET.clientFrame(dt); else updateGame(dt); }
  else if (G.state === 'title') {
    for (const p of G.players) { p.ch.carrying = p.pile.items.length > 0; p.ch.update(dt, 0, 4); let y = 0; for (const e of p.pile.items) { e.cy = y; y += ITEM[e.t].h; } }
    for (const c of G.customers) { if (c.state === 'walk' || c.state === 'queue') c.pat = 1; c.update(dt); }
    for (const s of STATIONS) updateStation(s, 0);
    G.t = G.dayLen * .42;
  }
  updateGoal(rdt);
  DECL.update(rdt);
  updateCamera(rdt);
  updateVisuals(dt);
  if (G.state !== 'title') HUD.update(rdt);
  renderer.render(scene, camera);
  PERF.ms = performance.now() - t0;
  PERF.frames++; PERF.acc += rdt; PERF.n++;
  if (PERF.acc >= 1) {
    PERF.fps = PERF.n / PERF.acc; PERF.acc = 0; PERF.n = 0;
    if (!QS.has('dpr')) { if (PERF.fps < 42) PERF.low++; else PERF.low = Math.max(0, PERF.low - 1);
      if (PERF.low >= 3 && dpr > 1) { dpr = Math.max(1, dpr - .25); renderer.setPixelRatio(dpr); onResize(); PERF.low = 0; } }
  }
}
function onResize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w < h ? 34 : 30; camera.updateProjectionMatrix();
  PFX.setScale(renderer.domElement.height);
  if (G.state === 'play' || G.state === 'paused' || G.state === 'summary') buildZones();
  HUD.layout();
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

// =============================================================================
// 28  BOOT
// =============================================================================
buildEnvironment();
buildStations();
buildModules();
buildPads();
let th0 = 0; try { th0 = +(localStorage.getItem('nrcc_theme') || 0) || 0; } catch (e) {}
if (QS.has('theme')) th0 = +QS.get('theme') - 1;
setTheme(th0);
onResize();
toTitle();
{ // first launch → How to play; ?room=CODE → join screen pre-filled
  const room = cleanCode(QS.get('room') || '');
  const after = () => { if (room) NET.showJoin(room); };
  if (lsGet('nrcc_tut_v1', '') !== 'done') TUT.open(after); else after();
}
requestAnimationFrame(() => { $('fade').style.opacity = 0; });
frame();
// test / debug hook (harmless in production)
window.__nrcc = { NET, TUT, G, ROLE, objEvent, DS: () => DS, STATIONS, SBY, PADS, CAM, UI, INPUT, CASHPILE, newGame, setTheme, endDay, toTitle, buyUpgrade, renderer, scene, PERF, THEMES,
  give: (n) => { G.cash += n; }, camera,
  proj: (x, y, z) => { const v = new THREE.Vector3(x, y, z).project(camera); return [(v.x + 1) / 2 * innerWidth, (1 - v.y) / 2 * innerHeight]; },
  state: () => ({ st: G.state, day: G.day, t: +G.t.toFixed(1), cash: +G.cash.toFixed(1), rep: +G.rep.toFixed(2), served: DS.served, lost: DS.lost, queue: G.queue.length, tray: CASHPILE.items.length,
    unlocked: [...G.unlocked], players: G.players.map(p => ({ x: +p.ch.pos.x.toFixed(2), z: +p.ch.pos.z.toFixed(2), stack: p.pile.items.map(e => e.t) })),
    st_: STATIONS.filter(s => s.unlocked).map(s => s.id + ':' + s.state + ':' + Object.keys(s.inputs).map(k => k + s.inputs[k].items.length).join(',') + ':out' + (s.out ? s.out.items.length : 0)),
    goal: GOAL.cur && GOAL.cur.txt, goalT: GOAL.cur && GOAL.cur.t ? [GOAL.cur.t.x, GOAL.cur.t.z] : null, front: G.queue[0] ? G.queue[0].need.join('+') + '@' + G.queue[0].state + G.queue[0].slot : null }),
  zones: () => INPUT.zones.map(z => z.r), DS: () => DS,
  unlock: (id) => { const u = PADS.find(x => x.id === id); if (u && !u.done) unlock(u, null, true); refreshPads(); },
  spawnQueued: (n) => { for (let i = 0; i < n; i++) { spawnCustomer(); const c = G.customers[G.customers.length - 1]; if (c.slot >= 0) { const s = SLOTS[Math.min(10, c.slot)]; c.ch.pos.set(s[0], 0, s[1]); c.path = []; c.state = 'walk'; c.wp = Math.min(10, c.slot); } } }, info: () => ({ calls: renderer.info.render.calls, tris: renderer.info.render.triangles, fps: PERF.fps, ms: PERF.ms, dpr }) };
</script>
</body>
</html>
